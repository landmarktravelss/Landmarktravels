<!DOCTYPE html>
<html>
<head>
<title>Landmark Travels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}
header {
  background: #0d6efd;
  color: white;
  padding: 20px;
  text-align: center;
}
.section {
  padding: 20px;
}
.packages {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 8px;
}
.card img {
  width: 100%;
  border-radius: 8px;
}
button {
  background: #0d6efd;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 5px;
  cursor: pointer;
}
input, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
}
footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>Landmark Travels</h1>
  <p>Best Tour Packages at Best Prices</p>
</header>

<div class="section">
  <h2>Our Tour Packages</h2>

  <div class="packages">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
      <h3>Beach Tour</h3>
      <p>Price: $499</p>
      <button onclick="goForm()">Book Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff">
      <h3>Mountain Tour</h3>
      <p>Price: $699</p>
      <button onclick="goForm()">Book Now</button>
    </div>

  </div>
</div>

<div class="section" id="form">
  <h2>Booking Form</h2>

  <input type="text" placeholder="Full Name">
  <input type="email" placeholder="Email">
  <input type="tel" placeholder="Phone Number">
  <input type="text" placeholder="City">
  <input type="text" placeholder="Zip Code">
  <textarea placeholder="Message"></textarea>

  <button>Submit</button>

  <h3>Pay Now</h3>
  <button onclick="window.open('https://payoneer.com','_blank')">Pay via Payoneer</button>
  <button onclick="window.open('https://skrill.com','_blank')">Pay via Skrill</button>
</div>

<footer>
  <p>© 2026 Landmark Travels</p>
</footer>

<script>
function goForm() {
  document.getElementById("form").scrollIntoView({behavior: "smooth"});
}
</script>

</body>
</html>
