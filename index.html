<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Landmark Travels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #ffffff;
  color: #222;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 8%;
  background: white;
  position: sticky;
  top: 0;
  z-index: 100;
}

nav h2 {
  font-weight: 600;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: #222;
  font-weight: 500;
}

/* HERO */
.hero {
  height: 80vh;
  background: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero div {
  background: rgba(255,255,255,0.85);
  padding: 40px;
  border-radius: 10px;
}

.hero h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 20px;
}

.hero button {
  padding: 12px 30px;
  border: none;
  background: black;
  color: white;
  font-size: 16px;
  cursor: pointer;
  border-radius: 30px;
}

/* SECTIONS */
.section {
  padding: 60px 8%;
}

.section h2 {
  text-align: center;
  margin-bottom: 40px;
  font-size: 32px;
}

/* PACKAGES */
.packages {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
}

.card {
  background: #f8f8f8;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card div {
  padding: 15px;
}

.card h3 {
  margin-bottom: 5px;
}

.card p {
  margin-bottom: 10px;
}

.card button {
  width: 100%;
  padding: 10px;
  border: none;
  background: black;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

/* FORM */
form {
  max-width: 500px;
  margin: auto;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

form button {
  width: 100%;
  padding: 12px;
  background: black;
  color: white;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

/* FOOTER */
footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<nav>
  <h2>Landmark Travels</h2>
  <div>
    <a href="#packages">Packages</a>
    <a href="#book">Book</a>
  </div>
</nav>

<section class="hero">
  <div>
    <h1>Explore the World with Us</h1>
    <p>Premium tour experiences curated for you</p>
    <button onclick="document.getElementById('packages').scrollIntoView({behavior:'smooth'})">
      View Tours
    </button>
  </div>
</section>

<section class="section" id="packages">
  <h2>Popular Tours</h2>

  <div class="packages">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
      <div>
        <h3>City Explorer</h3>
        <p>$399</p>
        <a href="payment.html?package=3%20Days%20Tour&price=400" class="btn">
  Book Now – $400
</a>
        <a href="payment.html?package=16%20Days%20Tour&price=2500" class="btn">
  Book Now – $2500
</a>

        <button onclick="window.location.href='payment.html'">
  Book Now
</button>

      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff">
      <div>
        <h3>Mountain Adventure</h3>
        <p>$699</p>
        <button onclick="goBook()">Book Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
      <div>
        <h3>Beach Escape</h3>
        <p>$499</p>
        <button onclick="goBook()">Book Now</button>
      </div>
    </div>

  </div>
</section>

<section class="section" id="book">
  <h2>Book Your Trip</h2>

  <button onclick="window.location.href='payment.html'">
  Book Now
</button>
</section>

<div class="contact-email">
  <a href="landmarktravelss@gmail.com" class="email-btn">
    <span class="email-icon">📧</span>
    Email Us
  </a>
</div>

<footer>
  <p>© 2026 Landmark Travels. All rights reserved.</p>
</footer>

<script>
function goBook(){
  document.getElementById("book").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
